[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Ismael Serratos <iaserrat@me.com>"]
repository = "https://github.com/iaserrat/software-design"

[workspace.dependencies]
syntax = { path = "crates/syntax" }
history = { path = "crates/history" }
rules = { path = "crates/rules" }
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-rust = "0.24.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
tokio = { version = "1.53.3", features = ["rt", "io-std", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A long method with a simple signature is fine; splitting it only to shorten it
# adds interfaces and separates code that is read together.
too_many_lines = "allow"
# Fact records hold independent yes/no facts, not a state machine in disguise.
struct_excessive_bools = "allow"
dbg_macro = "warn"
todo = "warn"
# Line ranges are the data: `vec![1..=3]` is one range, not a mistaken `(1..=3).collect()`.
single_range_in_vec_init = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
